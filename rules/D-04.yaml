id: D-04
version: "1.1"
name: Opted-out practitioner billing Medicare
reason_code: R-104
family: D
type: hard
owner: NeXari compliance
phase: Prototype
data: [optout, claims]
description: Medicare claim by an NPI during an active opt-out affidavit period.
params: {min_lines: 1}
reason: >-
  {{ n_lines }} Medicare claim lines on {{ n_dates }} dates while an opt-out affidavit was in effect
  ({{ eff_date|mdy }} to {{ end_date|mdy }}).
sql: |
  WITH hits AS (
    SELECT r.npi, o.eff_date, o.end_date, o._version AS v, o._row AS rw, count(*) AS n_lines,
           count(DISTINCT r.service_date) AS n_dates, min(r.service_date) AS event_date,
           list(r.line_id ORDER BY r.service_date, r.line_id)[1:50] AS evidence_claims
    FROM claim_roles r JOIN optouts o ON o.npi = r.npi
    WHERE r.role IN ('billing', 'rendering')
      AND r.service_date BETWEEN o.eff_date AND coalesce(o.end_date, DATE '9999-12-31')
    GROUP BY ALL HAVING count(*) >= {{ p.min_lines }})
  SELECT * EXCLUDE (v, rw),
         [{'source': 'optout', 'version': v, 'row': rw,
           'note': 'opt-out ' || strftime(eff_date, '%m/%d/%Y') || ' to ' || strftime(end_date, '%m/%d/%Y')}] AS evidence_sources
  FROM hits
