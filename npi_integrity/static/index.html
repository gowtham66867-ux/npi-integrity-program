<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPI Integrity Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <path d="M6 6 L34 34" stroke="#1f6fb2" stroke-width="9" stroke-linecap="round"/>
        <path d="M34 6 L6 34" stroke="#2f9e44" stroke-width="9" stroke-linecap="round"/>
        <rect x="16" y="16" width="8" height="8" transform="rotate(45 20 20)" fill="#0f2340"/>
      </svg>
      <div><b>TeXmed</b> <span class="muted">× NeXari</span><div class="sub">NPI Integrity Monitoring · prototype</div></div>
    </div>
    <nav id="nav">
      <a href="#/queue" data-v="queue">Alert queue</a>
      <a href="#/watch" data-v="watch">Watch list</a>
      <a href="#/scorecard" data-v="scorecard">Scorecard</a>
      <a href="#/rules" data-v="rules">Rules</a>
      <a href="#/sources" data-v="sources">Sources</a>
      <a href="#/audit" data-v="audit">Audit log</a>
    </nav>
    <div class="right">
      <form id="search" autocomplete="off"><input id="q" placeholder="Provider NPI or name · no PHI" aria-label="Search provider NPI or name; do not enter patient information"></form>
      <label class="reviewer">Reviewer <input id="reviewer" placeholder="your name"></label>
    </div>
  </header>
  <div class="runbar" id="runbar"></div>
  <main id="app"><p class="muted pad">Loading…</p></main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
