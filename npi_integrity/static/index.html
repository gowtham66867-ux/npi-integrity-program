<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPI Integrity Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
        <path d="M6 6 L34 34" stroke="#1f6fb2" stroke-width="9" stroke-linecap="round"/>
        <path d="M34 6 L6 34" stroke="#2f9e44" stroke-width="9" stroke-linecap="round"/>
        <rect x="16" y="16" width="8" height="8" transform="rotate(45 20 20)" fill="#0f2340"/>
      </svg>
      <div><b>TexMed</b> <span class="muted">NPI Integrity</span><div class="sub">Evidence-led pilot · synthetic data</div></div>
    </div>
    <div id="mode-switch" class="mode-switch" aria-label="Console view"></div>
    <nav id="nav">
      <a href="#/home" data-v="home" data-modes="clinic">Home</a>
      <a href="#/verify" data-v="verify" data-modes="clinic">Verify information</a>
      <a href="#/roster" data-v="roster" data-modes="clinic">Roster check</a>
      <a href="#/queue" data-v="queue" data-modes="clinic">Alerts</a>
      <a href="#/leads" data-v="leads" data-modes="government">Leads</a>
      <a href="#/watch" data-v="watch" data-modes="government">Watch list</a>
      <a href="#/methodology" data-v="methodology">Methodology &amp; Admin</a>
    </nav>
    <div class="right">
      <form id="search" autocomplete="off"><input id="q" placeholder="Provider NPI or name · no PHI" aria-label="Search provider NPI or name; do not enter patient information"></form>
      <label class="reviewer">Reviewer <input id="reviewer" placeholder="your name"></label>
    </div>
  </header>
  <div class="runbar" id="runbar"></div>
  <main id="app"><p class="muted pad">Loading…</p></main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
