[project]
name = "npi-integrity"
version = "0.1.0"
description = "TexMed x NeXari NPI Integrity Monitoring - prototype v0/v1"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6",
    "jinja2>=3",
    "rapidfuzz>=3",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "anthropic>=1.11",
    "google-cloud-firestore>=2.21,<3",
    "google-auth[requests]>=2.38,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
npi = "npi_integrity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["npi_integrity"]
